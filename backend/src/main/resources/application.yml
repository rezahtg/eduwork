# Spring Application Configuration
spring:
  application:
    name: eduwork-platform
  
  datasource:
    url: jdbc:postgresql://localhost:5432/eduwork_dev
    username: eduwork_user
    password: eduwork_pass
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      initialization-fail-timeout: -1  # Wait indefinitely for first connection
  
  # JPA Configuration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update  # Hibernate manages schema when Flyway is disabled
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  
  # Flyway Configuration
  flyway:
    enabled: false  # Disabled for testing - Hibernate manages schema
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: public
  
  # Redis Configuration
  data:
    redis:
      host: localhost
      port: 6379
      password: # No password for local dev
      timeout: 2000ms
      jedis:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  
  
  # Cache Configuration
  cache:
    type: redis
    redis:
      time-to-live: 1800000  # 30 minutes default TTL
      cache-null-values: false
      use-key-prefix: true
      key-prefix: "eduwork:"
  
  # Elasticsearch Configuration
  elasticsearch:
    uris: http://localhost:9200
  
  # Mail Configuration (for development with MailHog)
  mail:
    host: localhost
    port: 2025
    username:
    password:
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  
  # Jackson Configuration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Jakarta
    default-property-inclusion: non_null

# Application Configuration
app:
  name: Eduwork Platform
  version: 0.1.0
  verification:
    token-expiration: 900000  # 15 minutes in milliseconds
    max-resend-attempts: 3
    resend-cooldown: 300000  # 5 minutes in milliseconds
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}
  
  # JWT Configuration
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-key-change-in-production-make-it-long-enough}
    access-token-expiration: 900000  # 15 minutes in milliseconds
    refresh-token-expiration: 604800000  # 7 days in milliseconds
    issuer: eduwork-platform
  
  # Security Configuration
  security:
    max-login-attempts: 5
    account-lock-duration: 1800000 # 30 minutes
    # Brute Force Protection
    brute-force:
      max-attempts: 5 # Lock account after N failed attempts
      attempt-window: 15m # Time window for counting attempts
      lock-duration: 30m # How long account stays locked
      max-ip-attempts: 10 # Max attempts per IP address
      ip-window: 15m # IP rate limit window
    rate-limit:
      enabled: true
      requests-per-minute: 60
  
  # File Upload Configuration
  upload:
    max-file-size: 5MB
    max-request-size: 10MB
    allowed-extensions: jpg,jpeg,png,pdf
  
  # Admin Configuration
  admin:
    default-email: admin@eduwork.id
    default-password: ${ADMIN_PASSWORD:ChangeMe123!}

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /api/v1
  compression:
    enabled: true
  error:
    include-message: always
    include-binding-errors: always

# Logging Configuration
logging:
  level:
    root: INFO
    com.eduwork: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/eduwork.log
    max-size: 10MB
    max-history: 30

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

# Springdoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false

# MinIO Configuration (S3-compatible object storage)
minio:
  url: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: eduwork-kyc
